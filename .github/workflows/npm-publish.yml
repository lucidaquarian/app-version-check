name: Publish to npm

# Publishes the package to npm when a GitHub Release is published, and can also
# be run on demand from the Actions tab (Run workflow).
#
# Requirements:
#   - An `NPM_TOKEN` repository secret set to an npm **Automation** token (or a
#     granular token with read-write for this package). Automation/granular
#     tokens bypass 2FA; a classic "Publish" token triggers an EOTP prompt that
#     CI cannot answer, so it must NOT be used here.
#
# Release flow:
#   1. Bump `version` in package.json and merge to the default branch.
#   2. Create a GitHub Release (e.g. tag `v1.1.0`) — this triggers publish.
#   The job skips automatically if that version is already on npm.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          registry-url: 'https://registry.npmjs.org'

      - name: Verify NPM_TOKEN is set
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NPM_TOKEN}" ]; then
            echo "::error::NPM_TOKEN secret is not set. Add an npm Automation token in Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Check whether this version is already published
        id: published
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "${NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${NAME}@${VERSION} is already on npm — skipping publish."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Publishing ${NAME}@${VERSION}"
          fi

      # prepublishOnly re-runs lint + test as a final safety net.
      # --provenance is omitted because it requires a public repo (this is
      # private); the package is still published publicly via --access public.
      - name: Publish
        if: steps.published.outputs.skip == 'false'
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
